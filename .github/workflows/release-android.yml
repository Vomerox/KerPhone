name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          REF="${{ github.ref_name }}"
          VERSION="${REF#release/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version : $VERSION"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android + MAUI workloads
        run: dotnet workload install android maui-android

      - name: Restore workloads from project
        run: dotnet workload restore src/KerPhoneAndroid/KerPhoneAndroid.csproj

      - name: Restore NuGet dependencies
        run: dotnet restore src/KerPhoneAndroid/KerPhoneAndroid.csproj --verbosity normal

      - name: Build APK
        run: |
          dotnet publish src/KerPhoneAndroid/KerPhoneAndroid.csproj \
            -f net8.0-android \
            -c Release \
            --no-restore \
            --verbosity normal

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find . -name "*-Signed.apk" -not -path "*/obj/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -not -path "*/obj/*" | head -1)
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK trouvé : $APK_PATH"

      - name: Rename APK
        run: cp "${{ steps.apk.outputs.path }}" KerPhone-${{ steps.version.outputs.version }}.apk

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: KerPhone ${{ steps.version.outputs.version }}
          files: KerPhone-${{ steps.version.outputs.version }}.apk
          body: |
            ## KerPhone ${{ steps.version.outputs.version }}

            Télécharger **KerPhone-${{ steps.version.outputs.version }}.apk** ci-dessous et l'installer sur Android (API 33 minimum).

            *Développé par l'association KerBzh - Chef de projet Pierre LEGENDRE*
